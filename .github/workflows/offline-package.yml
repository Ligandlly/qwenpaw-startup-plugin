name: Build & package offline bundle

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: qwenpaw-startup-page-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck, tests & bundle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Typecheck
        run: npm run typecheck
      - name: Run vitest
        run: npm run test
      - name: Build bundle
        run: npm run build
      - name: Assert the bundle stays host-resolvable
        run: |
          set -euo pipefail
          if grep -qE '\brequire\s*\(' dist/index.js; then
            echo "::error::dist/index.js must not contain require() calls"
            exit 1
          fi
          if grep -qE '^[[:space:]]*import[[:space:]]' dist/index.js; then
            echo "::error::dist/index.js must not contain bare imports"
            exit 1
          fi
          if grep -qE '\bexport[[:space:]]*\{' dist/index.js; then
            echo "::error::dist/index.js must not contain ESM exports"
            exit 1
          fi
          ls -lh dist/index.js
      - uses: actions/upload-artifact@v4
        with:
          name: bundle
          path: dist/index.js
          if-no-files-found: error
          retention-days: 7

  package:
    name: Offline install package
    runs-on: ubuntu-latest
    needs: [check]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: bundle
          path: dist
      - name: Verify tag matches plugin.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          manifest_version="$(node -p "require('./plugin.json').version")"
          tag_version="${GITHUB_REF_NAME#v}"
          if [[ "$manifest_version" != "$tag_version" ]]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match plugin.json version ${manifest_version}"
            exit 1
          fi
      - name: Package
        run: node scripts/package.mjs
      - name: Smoke-test the actual zip
        run: |
          set -euo pipefail
          rm -rf /tmp/offline && mkdir -p /tmp/offline
          unzip -q release/*.zip -d /tmp/offline
          stage=/tmp/offline/qwenpaw-startup-page
          test -f "$stage/plugin.json"
          test -f "$stage/dist/index.js"
          node -e '
            const m = require("/tmp/offline/qwenpaw-startup-page/plugin.json");
            if (m.type !== "frontend") throw new Error("manifest type must be frontend");
            if (m.entry?.frontend !== "dist/index.js") throw new Error("unexpected frontend entry");
            console.log(`${m.id}@${m.version} -> ${m.entry.frontend}`);
          '
      - name: Show bundle
        run: |
          set -euo pipefail
          ls -lh release
          cat release/*.sha256
          {
            echo "### Offline install package"
            echo '```'
            ls -lh release
            cat release/*.sha256
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: offline-package
          path: |
            release/*.zip
            release/*.sha256
          if-no-files-found: error
          retention-days: 90

  release:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [package]
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: offline-package
          path: release
      - name: Create or update release
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          zip_name="$(basename release/*.zip)"
          cat > /tmp/release-notes.md <<NOTES
          QwenPaw Startup Page ${tag} — 离线安装包 / offline bundle.

          插件是纯前端，安装时不需要联网，也不需要 npm/PyPI。

          **QwenPaw 正在运行**：直接把 zip 交给 CLI，会走 API 热安装：

              qwenpaw plugin install ./${zip_name}

          **QwenPaw 未运行**（完全离线）：先解压，再指向目录：

              unzip ${zip_name}
              qwenpaw plugin install ./qwenpaw-startup-page

          装好后新开一个标签页进入聊天页，第一次会看到启动页。

          SHA256: \`${zip_name}.sha256\`
          NOTES
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" release/*.zip release/*.sha256 \
              -R "$GITHUB_REPOSITORY" --clobber
          else
            gh release create "$tag" release/*.zip release/*.sha256 \
              -R "$GITHUB_REPOSITORY" \
              --title "QwenPaw Startup Page ${version}" \
              --notes-file /tmp/release-notes.md
          fi
          gh release view "$tag" -R "$GITHUB_REPOSITORY" --json url,assets \
            --jq '.url, (.assets[] | .name + "  " + (.size|tostring) + " bytes")'
